name: cPanel release package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: composer install --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Validate and test backend
        run: |
          composer validate --strict
          composer audit --locked --no-interaction
          php vendor/bin/phpunit

      - name: Validate and build frontend
        run: |
          npm ci
          npm run lint:check
          npm run format:check
          npm run types:check
          npm run build

      - name: Remove development dependencies
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Create cPanel package
        run: |
          mkdir -p release/fakt-app-core release/fakt-app-public
          rsync -a ./ release/fakt-app-core/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='database/*.sqlite*' \
            --exclude='node_modules' \
            --exclude='release' \
            --exclude='tests' \
            --exclude='tools'
          cp -a public/. release/fakt-app-public/
          cp deploy/cpanel-public-index.php release/fakt-app-public/index.php
          cp deploy/.env.cpanel.example release/fakt-app-core/.env.cpanel.example
          cp deploy/RACKHOST-QUICK-DEPLOY.md release/DEPLOYMENT-GUIDE.md
          cp deploy/RACKHOST.md release/DEPLOYMENT-GUIDE-DETAILED.md
          cp deploy/DEPLOYMENT-LOG-TEMPLATE.md release/DEPLOYMENT-LOG-TEMPLATE.md
          cp docs/CHANGELOG-2026-08-18.md release/CHANGELOG.md
          cd release
          zip -qr fakt-cpanel-release.zip fakt-app-core fakt-app-public DEPLOYMENT-GUIDE.md DEPLOYMENT-GUIDE-DETAILED.md DEPLOYMENT-LOG-TEMPLATE.md CHANGELOG.md

      - name: Upload cPanel package
        uses: actions/upload-artifact@v6
        with:
          name: fakt-cpanel-release
          path: release/fakt-cpanel-release.zip
          if-no-files-found: error
          retention-days: 30
