name: cPanel release package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: composer install --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Validate and test backend
        run: |
          composer validate --strict
          composer audit --locked --no-interaction
          php vendor/bin/phpunit

      - name: Validate and build frontend
        run: |
          npm ci
          npm run lint:check
          npm run format:check
          npm run types:check
          npm audit --audit-level=high
          npm run build

      - name: Remove development dependencies
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Create cPanel package
        run: |
          mkdir -p release/fakt-app-core release/fakt-app-public
          rsync -a ./ release/fakt-app-core/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='database/*.sqlite*' \
            --exclude='node_modules' \
            --exclude='release' \
            --exclude='tests' \
            --exclude='tools'
          cp -a public/. release/fakt-app-public/
          cp deploy/cpanel-public-index.php release/fakt-app-public/index.php
          cp deploy/.env.cpanel.example release/fakt-app-core/.env.cpanel.example
          cp deploy/RACKHOST-QUICK-DEPLOY.md release/DEPLOYMENT-GUIDE.md
          cp deploy/RACKHOST.md release/DEPLOYMENT-GUIDE-DETAILED.md
          cp deploy/DEPLOYMENT-LOG-TEMPLATE.md release/DEPLOYMENT-LOG-TEMPLATE.md
          cp docs/CHANGELOG-2026-08-18-SECURITY.md release/CHANGELOG.md
          cp docs/SECURITY-HARDENING.md release/SECURITY-HARDENING.md
          cd release
          zip -qr fakt-cpanel-release.zip fakt-app-core fakt-app-public DEPLOYMENT-GUIDE.md DEPLOYMENT-GUIDE-DETAILED.md DEPLOYMENT-LOG-TEMPLATE.md CHANGELOG.md SECURITY-HARDENING.md
          sha256sum fakt-cpanel-release.zip > fakt-cpanel-release.zip.sha256

      - name: Verify cPanel package contents
        run: |
          unzip -t release/fakt-cpanel-release.zip
          unzip -l release/fakt-cpanel-release.zip | grep -q 'fakt-app-core/vendor/autoload.php'
          unzip -l release/fakt-cpanel-release.zip | grep -q 'fakt-app-public/index.php'
          unzip -l release/fakt-cpanel-release.zip | grep -q 'SECURITY-HARDENING.md'
          if unzip -l release/fakt-cpanel-release.zip | grep -Eq 'fakt-app-core/(\.env$|node_modules/|tests/)'; then
            echo 'Forbidden development or secret file found in release package.' >&2
            exit 1
          fi

      - name: Upload cPanel package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fakt-cpanel-release
          path: |
            release/fakt-cpanel-release.zip
            release/fakt-cpanel-release.zip.sha256
          if-no-files-found: error
          retention-days: 30
