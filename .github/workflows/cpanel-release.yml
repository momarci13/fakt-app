name: cPanel release package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress --no-blocking

      - name: Report known dependency advisories
        continue-on-error: true
        run: composer audit --locked --no-interaction

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Create cPanel package
        run: |
          mkdir -p release/fakt-app-core release/fakt-app-public
          rsync -a ./ release/fakt-app-core/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='database/*.sqlite*' \
            --exclude='node_modules' \
            --exclude='release' \
            --exclude='tests' \
            --exclude='tools'
          cp -a public/. release/fakt-app-public/
          cp deploy/cpanel-public-index.php release/fakt-app-public/index.php
          cp deploy/.env.cpanel.example release/fakt-app-core/.env.cpanel.example
          cd release
          zip -qr fakt-cpanel-release.zip fakt-app-core fakt-app-public

      - name: Upload cPanel package
        uses: actions/upload-artifact@v4
        with:
          name: fakt-cpanel-release
          path: release/fakt-cpanel-release.zip
          if-no-files-found: error
          retention-days: 30
